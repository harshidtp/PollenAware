name: PollenAware CI

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    name: Test Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Auth Service dependencies
        working-directory: services/auth-service
        run: npm ci

      - name: Install User Service dependencies
        working-directory: services/user-service
        run: npm ci

      - name: Install Environmental Service dependencies
        working-directory: services/environmental-service
        run: npm ci

      - name: Install Risk Assessment dependencies
        working-directory: services/risk-assessment-service
        run: npm ci

      - name: Run Risk Assessment tests
        working-directory: services/risk-assessment-service
        run: npm test

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Auth Service image
        run: docker build -t pollenaware-auth ./services/auth-service

      - name: Build User Service image
        run: docker build -t pollenaware-user ./services/user-service

      - name: Build Environmental Service image
        run: docker build -t pollenaware-environmental ./services/environmental-service

      - name: Build Risk Assessment image
        run: docker build -t pollenaware-risk-assessment ./services/risk-assessment-service
