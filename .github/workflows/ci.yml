name: PollenAware CI

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - develop
      - main

jobs:
  risk-assessment-tests:
    name: Risk Assessment Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/risk-assessment-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/risk-assessment-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
